# =============================================================================
# Deploy Application
# =============================================================================
# Manual workflow (workflow_dispatch) that builds the Docker image, pushes
# it to Amazon ECR, and deploys it to ECS Fargate.
#
# Jobs:
#   1. build-and-push — Builds the production Docker image and pushes to ECR
#                        with two tags: full commit SHA and "latest"
#   2. deploy         — Forces a new ECS deployment to pull the latest image
#                        and waits for the service to stabilize
#
# The deploy job uses a GitHub Environment gate for optional manual approval.
#
# ECR repository naming: csgtest-{environment} (e.g., csgtest-test, csgtest-prod)
# ECS cluster/service naming: csgtest-{environment}
#
# Required GitHub Secrets:
#   - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
# =============================================================================

name: Deploy Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - test
          - prod

permissions:
  contents: read

# AWS credentials shared across all jobs
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build & Push
  # Builds the production Docker image from app/Dockerfile and pushes it to
  # the environment-specific ECR repository. The account ID is resolved
  # dynamically via STS so it doesn't need to be hardcoded or stored as a secret.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Expose image metadata so the deploy job can reference it if needed
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_repo: ${{ steps.meta.outputs.ecr_repo }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Resolve AWS account ID at runtime and build the full ECR repo URL
      # Tags with the full commit SHA for traceability
      - name: Set image metadata
        id: meta
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REPO="${ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/csgtest-${{ inputs.environment }}"
          IMAGE_TAG="${{ github.sha }}"
          echo "ecr_repo=${ECR_REPO}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      # Authenticate Docker to the private ECR registry
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
            docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      # Build from the production Dockerfile (multi-stage, hardened, non-root)
      # Two tags: commit SHA (immutable, for rollbacks) and latest (mutable, for ECS)
      - name: Build Docker image
        working-directory: app
        run: |
          docker build -t ${{ steps.meta.outputs.ecr_repo }}:${{ steps.meta.outputs.image_tag }} .
          docker tag ${{ steps.meta.outputs.ecr_repo }}:${{ steps.meta.outputs.image_tag }} ${{ steps.meta.outputs.ecr_repo }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ steps.meta.outputs.ecr_repo }}:${{ steps.meta.outputs.image_tag }}
          docker push ${{ steps.meta.outputs.ecr_repo }}:latest

  # ---------------------------------------------------------------------------
  # Job 2: Deploy to ECS
  # Forces a new deployment on the ECS service, which pulls the :latest image.
  # Waits for the service to reach a stable state (all tasks healthy).
  # Uses a GitHub Environment gate for optional manual approval.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ECS (${{ inputs.environment }})
    runs-on: ubuntu-latest
    needs: build-and-push
    # GitHub Environment gate — configure required reviewers in repo settings
    environment: ${{ inputs.environment }}
    steps:
      # Trigger a rolling deployment — ECS will drain old tasks and start new
      # ones with the latest image from ECR
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster csgtest-${{ inputs.environment }} \
            --service csgtest-${{ inputs.environment }} \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      # Block until all new tasks are running and healthy (or timeout after ~10min)
      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster csgtest-${{ inputs.environment }} \
            --services csgtest-${{ inputs.environment }} \
            --region ${{ secrets.AWS_REGION }}
          echo "Deployment complete!"
