# =============================================================================
# Terraform Plan
# =============================================================================
# Runs terraform plan on every push/PR that touches terraform/ files.
#
# Uses a matrix strategy to plan both environments (test + prod) in parallel,
# but skips the environment that doesn't match the current branch:
#   - develop branch → plans only "test"
#   - main branch    → plans only "prod"
#
# On pull requests, posts the plan output as a PR comment for review.
# Plan artifacts are uploaded for use by the terraform-apply workflow.
#
# Required GitHub Secrets:
#   - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   - DB_PASSWORD_TEST, DB_PASSWORD_PROD
# =============================================================================

name: Terraform Plan

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'

permissions:
  contents: read
  # Needed to post plan output as PR comments
  pull-requests: write

# AWS credentials shared across all jobs via environment variables
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  plan:
    name: Terraform Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest

    # Matrix runs test and prod in parallel; the skip step below filters
    # so only the matching branch-environment pair actually executes
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: test
            branch: develop
            db_password_secret: DB_PASSWORD_TEST
          - environment: prod
            branch: main
            db_password_secret: DB_PASSWORD_PROD

    # Guard: only run when triggered from develop or main
    if: >-
      (github.ref == 'refs/heads/develop' || github.base_ref == 'develop') ||
      (github.ref == 'refs/heads/main' || github.base_ref == 'main')

    steps:
      # Compare the trigger branch against the matrix branch to decide
      # whether this matrix entry should run or be skipped entirely
      - name: Skip if branch does not match environment
        id: check
        run: |
          REF="${{ github.base_ref || github.ref_name }}"
          if [[ "${{ matrix.branch }}" != "$REF" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Setup Terraform
        if: steps.check.outputs.skip == 'false'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      # Initialize Terraform with the remote S3 backend for the target environment
      - name: Terraform Init
        if: steps.check.outputs.skip == 'false'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init

      # Validate syntax and configuration before planning
      - name: Terraform Validate
        if: steps.check.outputs.skip == 'false'
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

      # Generate the execution plan; db_password is injected from the
      # environment-specific secret via the matrix config
      - name: Terraform Plan
        if: steps.check.outputs.skip == 'false'
        working-directory: terraform/environments/${{ matrix.environment }}
        env:
          TF_VAR_db_password: ${{ secrets[matrix.db_password_secret] }}
          TF_VAR_route53_zone_id: ${{ secrets.ROUTE53_ZONE_ID }}
          TF_VAR_recaptcha_site_key: ${{ secrets.RECAPTCHA_SITE_KEY }}
          TF_VAR_recaptcha_secret_key: ${{ secrets.RECAPTCHA_SECRET_KEY }}
        run: |
          terraform plan -out=tfplan -no-color 2>&1 | tee plan_output.txt

      # Save the binary plan file so terraform-apply can use it later
      # without re-planning (ensures exact same changes are applied)
      - name: Upload Plan Artifact
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: terraform/environments/${{ matrix.environment }}/tfplan
          retention-days: 5

      # Post the human-readable plan as a collapsible PR comment
      # so reviewers can see infrastructure changes before merging
      - name: Comment Plan on PR
        if: steps.check.outputs.skip == 'false' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/${{ matrix.environment }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.substring(0, 60000) + '\n... (truncated)' : plan;
            const body = `### Terraform Plan — \`${{ matrix.environment }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
